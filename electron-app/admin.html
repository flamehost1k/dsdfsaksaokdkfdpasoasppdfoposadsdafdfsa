<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MenaceSEARCH — Admin</title>
<style>
body{font-family:Inter,Arial,sans-serif;background:#121218;color:#fff;padding:24px;margin:0}
h1{margin:0 0 20px;font-size:24px} .top{display:flex;gap:10px;margin-bottom:16px}
button,select{padding:8px 12px;border-radius:8px;border:1px solid #444;background:#242433;color:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse;background:#1a1a24;border-radius:10px;overflow:hidden}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid #2a2a38} th{background:#222230}
.avatar{width:36px;height:36px;border-radius:50%;vertical-align:middle;margin-right:8px}
.badge{padding:4px 8px;border-radius:6px;font-size:12px;font-weight:700}.free{background:#555}.pro{background:#007bff}.business{background:#ffc107;color:#000}
#status{margin:10px 0;color:#aaa}
</style>
</head>
<body>
<h1>Пользователи MenaceSEARCH</h1>
<div class="top"><button id="refresh">Обновить</button><button id="logout">Выйти</button></div>
<div id="status">Загрузка...</div>
<table><thead><tr><th>ID</th><th>Пользователь</th><th>Telegram ID</th><th>План</th><th>Регистрация</th><th>Действия</th></tr></thead>
<tbody id="users-list"></tbody></table>
<script>
const API='https://menacesearch-backend.onrender.com';
let token=localStorage.getItem('menacesearch_session_token')||'';

async function api(path,options={}){
    const r=await fetch(API+path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(options.headers||{})}});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
    return d;
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){
    const box=document.getElementById('users-list');
    document.getElementById('status').textContent='Загрузка...';
    try{
        const data=await api('/api/admin/users');
        box.innerHTML=(data.users||[]).map(u=>`<tr>
        <td>${u.id}</td>
        <td>${u.photo_url?`<img class="avatar" src="${esc(u.photo_url)}">`:''}${esc(u.first_name||'—')} (@${esc(u.username||'n/a')})</td>
        <td>${esc(u.telegram_id)}</td>
        <td><span class="badge ${esc(u.plan)}">${esc(u.plan)}</span></td>
        <td>${u.created_at?new Date(u.created_at).toLocaleString('ru-RU'):'—'}</td>
        <td><select id="p-${u.id}"><option value="basic">Basic</option><option value="pro">Pro</option><option value="business">Business</option></select>
        <button onclick="save(${u.id})">Сохранить</button>
        <button onclick="removeSub(${u.id})">Забрать</button></td></tr>`).join('');
        (data.users||[]).forEach(u=>{const s=document.getElementById('p-'+u.id);if(s)s.value=u.plan==='free'?'basic':u.plan});
        document.getElementById('status').textContent=`Пользователей: ${(data.users||[]).length}`;
    }catch(e){document.getElementById('status').textContent='Ошибка: '+e.message;box.innerHTML=''}
}
async function save(id){try{const plan=document.getElementById('p-'+id).value;await api('/api/admin/subscription',{method:'POST',body:JSON.stringify({userId:id,plan,planExpiry:plan==='basic'?null:new Date(Date.now()+30*86400000).toISOString()})});await load()}catch(e){alert(e.message)}}
async function removeSub(id){if(!confirm('Забрать подписку?'))return;try{await api('/api/admin/subscription/'+id,{method:'DELETE'});await load()}catch(e){alert(e.message)}}
document.getElementById('refresh').onclick=load;
document.getElementById('logout').onclick=()=>{localStorage.removeItem('menacesearch_session_token');location.reload()};
load();
</script>
</body></html>
