<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Telegram — MenaceSEARCH</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            background:#0d0d14;
            color:rgba(255,255,255,.65);
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        }
        h2{font-size:18px;color:#fff;margin-bottom:8px}
        p{font-size:13px;line-height:1.5;text-align:center;max-width:340px;margin-bottom:24px}
        .widget{min-height:48px}
        .status{margin-top:16px;min-height:24px;font-size:13px;color:rgba(255,255,255,.3)}
        .status.ok{color:#4caf50}
        .status.error{color:#ff5f57}
        .status.loading{color:#ff2d95}
    </style>
</head>
<body>
    <h2>MenaceSEARCH Pro</h2>
    <p>Войдите через Telegram, чтобы продолжить</p>

    <div class="widget">
        <script async src="https://telegram.org/js/telegram-widget.js?22"
            data-telegram-login="MenaceAuthRobot"
            data-size="large"
            data-onauth="onTelegramAuth(user)"
            data-request-access="write"></script>
    </div>

    <div id="status" class="status">Нажмите кнопку для входа</div>

    <script>
        function onTelegramAuth(user) {
            const status = document.getElementById('status');
            status.textContent = '⏳ Завершение авторизации...';
            status.className = 'status loading';

            const callback =
                new URLSearchParams(location.search).get('callback') ||
                'http://127.0.0.1:3847/callback';

            const params = new URLSearchParams();

            for (const [key, value] of Object.entries(user || {})) {
                if (value !== undefined && value !== null && value !== '') {
                    params.set(key, String(value));
                }
            }

            const separator = callback.includes('?') ? '&' : '?';

            status.textContent = '⏳ Передача данных в приложение...';
            location.href = callback + separator + params.toString();
        }
    </script>
</body>
</html>
