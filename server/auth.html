<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram — MenaceSEARCH</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0d0d14;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: rgba(255, 255, 255, 0.6);
        }
        h2 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }
        p {
            font-size: 13px;
            margin-bottom: 24px;
            text-align: center;
            max-width: 320px;
            line-height: 1.5;
        }
        .widget-wrap {
            min-height: 48px;
        }
    </style>
</head>
<body>
    <h2>MenaceSEARCH Pro</h2>
    <p>Войдите через Telegram, чтобы продолжить</p>
    <div class="widget-wrap">
        <script async src="https://telegram.org/js/telegram-widget.js?22"
            data-telegram-login="MenaceAuthRobot"
            data-size="large"
            data-onauth="onTelegramAuth(user)"
            data-request-access="write"></script>
    </div>
    <script>
        function onTelegramAuth(user) {
            const params = new URLSearchParams();
            Object.entries(user).forEach(([key, value]) => {
                if (value !== undefined && value !== null && value !== '') {
                    params.set(key, String(value));
                }
            });

            // Берём порт/ссылку редиректа из URL или по дефолту на 127.0.0.1:3847
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get('callback') || 'http://127.0.0.1:3847/callback';

            window.location.href = `${redirectUrl}?${params.toString()}`;
        }
    </script>
</body>
</html>
