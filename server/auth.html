<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram — MenaceSEARCH</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; background: #0d0d14;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: rgba(255, 255, 255, 0.6);
        }
        h2 { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 8px; }
        p { font-size: 13px; margin-bottom: 24px; text-align: center; max-width: 320px; line-height: 1.5; }
        .widget-wrap { min-height: 48px; }
        .status { margin-top: 16px; font-size: 13px; color: rgba(255,255,255,0.2); min-height: 24px; }
        .status.success { color: #4CAF50; }
        .status.error { color: #ff5f57; }
        .status.loading { color: #ff2d95; }
    </style>
</head>
<body>
    <h2>MenaceSEARCH Pro</h2>
    <p>Войдите через Telegram, чтобы продолжить</p>
    <div class="widget-wrap">
        <script async src="https://telegram.org/js/telegram-widget.js?22"
            data-telegram-login="__BOT_USERNAME__"
            data-size="large"
            data-onauth="onTelegramAuth(user)"
            data-request-access="write"></script>
    </div>
    <div class="status" id="status">Нажмите кнопку для входа</div>
    <script>
        function onTelegramAuth(user) {
            const status = document.getElementById('status');
            status.textContent = '⏳ Обработка...';
            status.className = 'status loading';

            console.log('[auth] Данные от Telegram:', user);

            // ==== ОТПРАВКА В ELECTRON через preload ====
            if (window.authAPI && window.authAPI.submitAuth) {
                window.authAPI.submitAuth(user);
                status.textContent = '✅ Данные отправлены в приложение';
                status.className = 'status success';
                return;
            }

            // ==== FALLBACK: редирект на локальный сервер ====
            const params = new URLSearchParams();
            Object.entries(user).forEach(([key, value]) => {
                if (value !== undefined && value !== null && value !== '') {
                    params.set(key, String(value));
                }
            });
            const callback = new URLSearchParams(window.location.search).get('callback')
                || 'http://127.0.0.1:3847/callback';
            const separator = callback.includes('?') ? '&' : '?';
            const redirectUrl = `${callback}${separator}${params.toString()}`;
            status.textContent = '⏳ Перенаправление...';
            status.className = 'status loading';
            window.location.href = redirectUrl;
        }

        // Сообщаем, что страница загружена
        console.log('[auth] Страница авторизации загружена');
        console.log('[auth] window.authAPI доступен:', !!window.authAPI);
    </script>
</body>
</html>
