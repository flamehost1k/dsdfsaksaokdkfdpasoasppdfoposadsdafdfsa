services:
  - type: web
    name: menacesearch-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        value: "8148135765"
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_PATH
        value: "./database.sqlite"
