<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram — MenaceSEARCH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#0d0d14;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:rgba(255,255,255,.65)}
h2{font-size:18px;color:#fff;margin-bottom:8px}
p{font-size:13px;margin-bottom:24px;text-align:center;max-width:320px;line-height:1.5}
.widget-wrap{min-height:48px}
.status{margin-top:16px;font-size:13px;color:rgba(255,255,255,.3);min-height:24px;text-align:center}
.status.success{color:#4caf50}.status.error{color:#ff5f57}.status.loading{color:#ff2d95}
</style>
</head>
<body>
<h2>MenaceSEARCH Pro</h2>
<p>Войдите через Telegram, чтобы продолжить</p>
<div class="widget-wrap">
<script async src="https://telegram.org/js/telegram-widget.js?22"
data-telegram-login="MenaceAuthRobot"
data-size="large"
data-onauth="onTelegramAuth(user)"
data-request-access="write"></script>
</div>
<div class="status" id="status">Нажмите кнопку для входа</div>
<script>
function onTelegramAuth(user){
    const status=document.getElementById('status');
    status.textContent='⏳ Обработка...';
    status.className='status loading';

    if(window.authAPI && typeof window.authAPI.submitAuth==='function'){
        window.authAPI.submitAuth(user);
        status.textContent='✅ Данные отправлены в приложение';
        status.className='status success';
        return;
    }

    const callback=new URLSearchParams(location.search).get('callback');
    if(!callback){
        status.textContent='Ошибка: callback не указан';
        status.className='status error';
        return;
    }

    const params=new URLSearchParams();
    for(const [key,value] of Object.entries(user||{})){
        if(value!==undefined && value!==null && value!=='') params.set(key,String(value));
    }

    status.textContent='⏳ Завершение авторизации...';
    location.href=callback+(callback.includes('?')?'&':'?')+params.toString();
}
</script>
</body>
</html>
