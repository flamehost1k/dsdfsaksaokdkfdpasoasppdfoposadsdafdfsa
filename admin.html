<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панель — Управление Подписками</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #121218;
            color: #fff;
            padding: 24px;
            margin: 0;
        }
        h1 { margin-bottom: 20px; font-size: 24px; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a24;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #2a2a38;
        }
        th { background: #222230; font-weight: 600; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; vertical-align: middle; margin-right: 8px; }
        select, button {
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 13px;
        }
        select { background: #2b2b3a; color: #fff; border: 1px solid #444; }
        .btn-grant { background: #28a745; color: #fff; margin-left: 6px; }
        .btn-revoke { background: #dc3545; color: #fff; margin-left: 6px; }
        .btn-grant:hover { background: #218838; }
        .btn-revoke:hover { background: #c82333; }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .plan-free { background: #555; color: #fff; }
        .plan-pro { background: #007bff; color: #fff; }
        .plan-vip { background: #ffc107; color: #000; }
    </style>
</head>
<body>

    <h1>Управление пользователями и подписками</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Пользователь</th>
                <th>Telegram ID</th>
                <th>Текущий План</th>
                <th>Дата регистрации</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="users-list">
            <tr><td colspan="6">Загрузка данных...</td></tr>
        </tbody>
    </table>

    <script>
        const API_URL = 'http://localhost:3000/api/admin';

        async function loadUsers() {
            try {
                const res = await fetch(`${API_URL}/users`);
                const data = await res.json();
                const tbody = document.getElementById('users-list');
                tbody.innerHTML = '';

                if (!data.users || data.users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6">Пользователи не найдены</td></tr>';
                    return;
                }

                data.users.forEach(user => {
                    const tr = document.createElement('tr');
                    const photo = user.photo_url ? `<img src="${user.photo_url}" class="avatar">` : '';
                    const planClass = `plan-${user.plan.toLowerCase()}`;

                    tr.innerHTML = `
                        <td>${user.id}</td>
                        <td>${photo}${user.first_name || '—'} (@${user.username || 'n/a'})</td>
                        <td>${user.telegram_id}</td>
                        <td><span class="badge ${planClass}">${user.plan}</span></td>
                        <td>${new Date(user.created_at).toLocaleString('ru-RU')}</td>
                        <td>
                            <select id="select-plan-${user.id}">
                                <option value="free" ${user.plan === 'free' ? 'selected' : ''}>Free</option>
                                <option value="pro" ${user.plan === 'pro' ? 'selected' : ''}>Pro</option>
                                <option value="vip" ${user.plan === 'vip' ? 'selected' : ''}>VIP</option>
                            </select>
                            <button class="btn-grant" onclick="grantSub(${user.id})">Сохранить</button>
                            <button class="btn-revoke" onclick="revokeSub(${user.id})">Забрать</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('users-list').innerHTML = '<tr><td colspan="6">Ошибка загрузки данных</td></tr>';
            }
        }

        async function grantSub(userId) {
            const plan = document.getElementById(`select-plan-${userId}`).value;
            try {
                const res = await fetch(`${API_URL}/subscription`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, plan })
                });
                const result = await res.json();
                if (result.success) {
                    alert('Подписка успешно обновлена');
                    loadUsers();
                } else {
                    alert('Ошибка: ' + result.error);
                }
            } catch (err) {
                alert('Не удалось обновить подписку');
            }
        }

        async function revokeSub(userId) {
            if (!confirm('Вы уверены, что хотите забрать подписку?')) return;
            try {
                const res = await fetch(`${API_URL}/subscription/${userId}`, {
                    method: 'DELETE'
                });
                const result = await res.json();
                if (result.success) {
                    alert('Подписка аннулирована');
                    loadUsers();
                } else {
                    alert('Ошибка: ' + result.error);
                }
            } catch (err) {
                alert('Не удалось забрать подписку');
            }
        }

        loadUsers();
    </script>
</body>
</html>
